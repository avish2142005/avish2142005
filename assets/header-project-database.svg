<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 86" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="regalHdrBg_03" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0704" />
      <stop offset="50%" stop-color="#140e08" />
      <stop offset="100%" stop-color="#0a0704" />
    </linearGradient>
    <filter id="hdrGoldGlow_03" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes goldEdgeTrace_03 {
        0% { stroke-dashoffset: 2100; }
        100% { stroke-dashoffset: 0; }
      }
      .laser-gold-edge_03 {
        stroke-dasharray: 190 1910;
        animation: goldEdgeTrace_03 5s linear infinite;
      }
    </style>
  </defs>

  <rect width="920" height="86" rx="4" fill="url(#regalHdrBg_03)" />
  <rect width="920" height="86" rx="4" fill="none" stroke="#2a1c0e" stroke-width="1.2" />
  <rect width="920" height="86" rx="4" fill="none" stroke="#f59e0b" stroke-width="2" class="laser-gold-edge_03" filter="url(#hdrGoldGlow_03)" />

  <!-- Section Number Badge -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="70" height="46" rx="3" fill="#160f07" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M 0 0 L 10 0 L 0 10 Z" fill="#f59e0b" />
    <text x="35" y="30" text-anchor="middle" font-family="'Cinzel', monospace" font-size="20" font-weight="900" fill="#fbbf24">03</text>
  </g>

  <!-- Main Title & Hierarchy -->
  <g transform="translate(108, 32)">
    <text x="0" y="0" font-family="'Cinzel', serif" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="2.5">PRODUCTION REPOSITORIES // SOFTWARE SUITE</text>
    <text x="0" y="24" font-family="'Courier New', monospace" font-size="11.5" font-weight="700" fill="#fde047" letter-spacing="1.5">AQUAOS (KERNEL) &#8226; NUTRI-AI (AI) &#8226; LIVE MARKDOWN (WEB)</text>
  </g>

  <!-- Royal Embellishment Emblem (Right) -->
  <g transform="translate(850, 43)">
    <circle cx="0" cy="0" r="22" fill="#140d06" stroke="#f59e0b" stroke-width="1.5" />
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#fbbf24" />
  </g>

  <line x1="108" y1="68" x2="800" y2="68" stroke="#2a1c0e" stroke-width="1" />
  <line x1="108" y1="68" x2="320" y2="68" stroke="#f59e0b" stroke-width="1.5" />
</svg>