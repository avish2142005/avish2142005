    <path d="M 90 220 L 110 275 L 135 282 L 160 275 L 180 220 L 150 250 L 135 255 L 120 250 Z" fill="#b45309" />
    <path d="M 110 240 L 125 280 L 135 282 L 145 280 L 160 240 L 142 260 L 135 262 L 128 260 Z" fill="#f59e0b" />
