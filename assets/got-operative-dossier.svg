    <circle cx="0" cy="0" r="11.200000000000001" fill="#ffffff" />
    <polygon points="0,-12.8 11.200000000000001,0 0,12.8 -11.200000000000001,0" fill="none" stroke="#120c06" stroke-width="1.5" />

    <!-- Regal Crown Apex -->
    <polygon points="0,-70.4 4,-65.6 10,-62.400000000000006 4,-59.2 0,-54.400000000000006 -4,-59.2 -10,-62.400000000000006 -4,-65.6" fill="#fde047" />
