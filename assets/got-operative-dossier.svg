    <circle cx="0" cy="-46.4" r="5" fill="#fde047" stroke="#b45309" stroke-width="1.2" />
    <circle cx="40" cy="-23.2" r="5" fill="#fde047" stroke="#b45309" stroke-width="1.2" />
