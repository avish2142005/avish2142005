    <circle cx="0" cy="0" r="80" fill="#0d0804" stroke="#3d2914" stroke-width="2" />
    <circle cx="0" cy="0" r="75.19999999999999" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.75" />
    <circle cx="0" cy="0" r="68.8" fill="#130d06" stroke="#f59e0b" stroke-width="2" />

