    </clipPath>
  </defs>

  <rect width="920" height="490" rx="6" fill="url(#aiDosBg)" />
  <rect width="920" height="490" rx="6" fill="none" stroke="#2e1f10" stroke-width="1.5" />
  <rect width="910" height="480" x="5" y="5" rx="4" fill="none" stroke="#1c1208" stroke-width="1" />

  <!-- Corner Brackets -->
