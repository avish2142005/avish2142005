    <polygon points="0,-46.4 40,-23.2 40,23.2 0,46.4 -40,23.2 -40,-23.2" fill="none" stroke="#fbbf24" stroke-width="2" />
    <polygon points="0,-30.4 26.400000000000002,0 0,30.4 -26.400000000000002,0" fill="#24160a" stroke="#fde047" stroke-width="1.8" />

