<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 86" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="apexHdrBg_02" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#080e18" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="hdrLaser_02" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes edgeTrace_02 {
        0% { stroke-dashoffset: 2100; }
        100% { stroke-dashoffset: 0; }
      }
      .laser-edge_02 {
        stroke-dasharray: 190 1910;
        animation: edgeTrace_02 5s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Obsidian Slab -->
  <rect width="920" height="86" rx="4" fill="url(#apexHdrBg_02)" />
  <rect width="920" height="86" rx="4" fill="none" stroke="#162232" stroke-width="1.2" />
  <rect width="920" height="86" rx="4" fill="none" stroke="#f59e0b" stroke-width="2" class="laser-edge_02" filter="url(#hdrLaser_02)" />

  <!-- Section Number Badge -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="70" height="46" rx="3" fill="#090f1a" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M 0 0 L 10 0 L 0 10 Z" fill="#f59e0b" />
    <text x="35" y="30" text-anchor="middle" font-family="'Cinzel', monospace" font-size="20" font-weight="900" fill="#fbbf24">02</text>
  </g>

  <!-- Main Title & Hierarchy -->
  <g transform="translate(108, 32)">
    <text x="0" y="0" font-family="'Cinzel', serif" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="2.5">THE RAPTOR'S ARSENAL // WEAPONS OF THE SKY</text>
    <text x="0" y="24" font-family="'Courier New', monospace" font-size="11.5" font-weight="700" fill="#fbbf24" letter-spacing="1.5">PRECISION TALONS &#8226; LOW-LEVEL ENGINES &#8226; COGNITIVE AI</text>
  </g>

  <!-- Eagle Eye Glyphic Embellishment (Right) -->
  <g transform="translate(850, 43)">
    <circle cx="0" cy="0" r="22" fill="#070c14" stroke="#f59e0b" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="12" ry="7" fill="#d97706" />
    <circle cx="0" cy="0" r="3.5" fill="#000000" />
    <circle cx="-2" cy="-2" r="1.2" fill="#ffffff" />
  </g>

  <!-- Talon Underline -->
  <line x1="108" y1="68" x2="800" y2="68" stroke="#162232" stroke-width="1" />
  <line x1="108" y1="68" x2="320" y2="68" stroke="#f59e0b" stroke-width="1.5" />
</svg>